name: Publish fgmetric to PyPI

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

# Ensure only one publish workflow runs at a time
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: 0.12.0
  PYTHON_VERSION: 3.12

jobs:
  tests:
    name: Static Analysis Checks
    uses: "./.github/workflows/python_package.yml"

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [tests]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "${{ env.UV_VERSION }}"
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: 'true'
          cache-suffix: ${{ env.PYTHON_VERSION }}

      - name: Build sdist and wheel
        run: |
          uv build --sdist --wheel

      - name: List built artifacts
        run: |
          ls -la dist/

      - name: Verify package metadata
        run: |
          uv run --with twine twine check --strict dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 30

  verify-install:
    name: Verify Installable Artifact
    needs: [build]
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        PYTHON_VERSION: ["3.12", "3.13", "3.14"]
        DIST: [whl, tar.gz]
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "${{ env.UV_VERSION }}"
          # `enable-cache` defaults to `auto`, which is on for GitHub-hosted runners.
          # This job exists to prove the artifact installs from a clean slate, so
          # resolve against upstream rather than a warm cache.
          enable-cache: 'false'

      - name: Import the built distribution
        run: |
          uv run --no-project \
            --python ${{ matrix.PYTHON_VERSION }} \
            --with dist/*.${{ matrix.DIST }} \
            python -P - <<'PY'
          import importlib, pkgutil
          import fgmetric as pkg
          for mod in pkgutil.walk_packages(pkg.__path__, pkg.__name__ + "."):
              importlib.import_module(mod.name)
          print("imported all submodules of", pkg.__name__)
          PY

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build, verify-install]

    environment:
      name: pypi  # Requires manual approval if configured
      url: https://pypi.org/p/${{ github.event.repository.name }}

    # Required for PyPI Trusted Publishing (OIDC)
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - name: List artifacts to publish
        run: |
          echo "Publishing the following artifacts to PyPI:"
          ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          skip-existing: true
          print-hash: true
          verbose: true

  make-changelog:
    name: Draft Changelog
    runs-on: ubuntu-latest
    needs: [publish-pypi]
    outputs:
      release_body: "${{ steps.git-cliff.outputs.content }}"
    steps:
      - name: Checkout the Repository at the Tagged Commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          ref: "${{ github.ref_name }}"

      - name: Generate a Changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff  # v4.9.1
        id: git-cliff
        with:
          config: pyproject.toml
          args: --latest --verbose
        env:
          GITHUB_REPO: "${{ github.repository }}"

  make-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    environment: github
    permissions:
      contents: write
    needs: make-changelog
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          name: '${{ github.ref_name }}'
          body: '${{ needs.make-changelog.outputs.release_body }}'
          draft: false
          prerelease: false
          files: "dist/*"
